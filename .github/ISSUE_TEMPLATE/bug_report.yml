name: Bug report
description: Report a reproducible problem in a public SMMly repository
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, tokens, customer information, or payment details. For suspected security vulnerabilities, follow the security policy instead.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: A clear description of the issue.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Repository, version, browser/runtime, and relevant non-sensitive configuration.
    validations:
      required: false
